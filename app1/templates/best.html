{% extends "base.html" %}
{% load static %}

{% block title %}
Best Selling
{% endblock title %}

{% block content %}
<div class="miniaturepage">
    <h1 class="head">Best Sellers</h1>
    <div class="minifull">
        {% for i in bestselle %}
        <div class="miniproduct">
            <a href="{% url 'product_detail' i.id  %}">
                {% if i.image%}
                <img class="miniphoto" src="{{ i.image.url }}" alt="">
                <p class="minip">{{ i.name }}</p>
                <p class="miniprice">
                    <del class="price">RS.{{ i.price }}</del>
                    <strong class="dprice">RS.{{ i.dprice }}</strong>
                </p>
                {% endif %}
            </a>
            <a href="{% url 'cart' i.id %}"><button class="addto">Add to cart</button></a>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock content %}
